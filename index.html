<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radhe Study Care</title>
<style>
:root{--bg:#EEF0FA;--ink:#14172B;--card:#fff;--mut:#6B7192;--ac:#5B4BFF;--ac2:#14B8A6;--ln:#E3E6F5;--sf:#F6F7FD;--sb:#14172B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0D1A;--ink:#EEF0FF;--card:#171A30;--mut:#9AA0C6;--ac:#8B7CFF;--ac2:#2DD4BF;--ln:#262A47;--sf:#1D2140;--sb:#10122A}}
:root[data-theme="dark"]{--bg:#0B0D1A;--ink:#EEF0FF;--card:#171A30;--mut:#9AA0C6;--ac:#8B7CFF;--ac2:#2DD4BF;--ln:#262A47;--sf:#1D2140;--sb:#10122A}
*{box-sizing:border-box;margin:0;font-family:'Baloo 2','Noto Sans Devanagari',system-ui,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);display:flex}
aside{width:230px;background:var(--sb);color:#EEF0FF;padding:22px 14px;display:flex;flex-direction:column;gap:6px;flex:none}
.logo{font-size:22px;font-weight:700;padding:0 10px 18px}
aside button.nv{display:flex;gap:12px;align-items:center;border:0;background:none;color:#B8BDE6;font-size:15px;font-weight:600;padding:11px 12px;border-radius:14px;cursor:pointer;text-align:left}
aside button.nv:hover{background:rgba(255,255,255,.07)}
aside button.nv.on{background:var(--ac);color:#fff}
.sp{flex:1}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
aside .chip{background:rgba(255,255,255,.08);color:#fff;border-color:transparent;margin-top:4px}
.wrap{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:22px 32px 6px}header h1{font-size:28px}header small{color:var(--mut);font-size:14px}
main{flex:1;overflow-y:auto;padding:12px 32px 32px}
section{display:none;max-width:1100px}section.on{display:block}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
.hero{background:linear-gradient(135deg,var(--ac),#3B2BD6);color:#fff;border-radius:24px;padding:22px;display:flex;align-items:center;gap:18px;margin-bottom:16px}
.hero b{font-size:36px;display:block;line-height:1}.hero span{font-size:14px;opacity:.88}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center;flex:none}
.ring i{width:64px;height:64px;border-radius:50%;background:#3B2BD6;display:grid;place-items:center;font-style:normal;font-weight:700}
.add{display:flex;gap:10px;margin-bottom:14px}
.add input{flex:1;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 16px;font-size:15px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:0 20px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.btn.alt{background:var(--ac2);color:#06231F}
.task{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;border-left:5px solid var(--c)}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);background:none;color:#fff;cursor:pointer;flex:none}
.task.done .chk{background:var(--ac2);border-color:var(--ac2)}
.t{font-weight:600;font-size:16px}.s{font-size:13px;color:var(--mut)}
.x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
h2{font-size:19px;margin:4px 0 12px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.sw{width:48px;height:27px;border-radius:14px;background:var(--ln);position:relative;cursor:pointer;flex:none;margin-left:auto;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ac2)}.sw.on::after{left:24px}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.big{width:260px;height:260px;margin:10px auto 18px;border-radius:50%;background:conic-gradient(var(--ac2) calc(var(--p)*1%),var(--ln) 0);display:grid;place-items:center}
.big div{width:226px;height:226px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:56px;font-weight:700}
.row{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.bk{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cv{height:130px;border-radius:8px 14px 14px 8px;background:var(--c);box-shadow:inset 8px 0 0 rgba(0,0,0,.18);display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700}
.tm{font-size:26px;font-weight:700}
.lock{position:fixed;inset:0;background:rgba(11,13,26,.95);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;z-index:9}
.lock.on{display:flex}.lock b{font-size:64px}.lock .tm{font-size:64px}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;flex-direction:row;overflow-x:auto;padding:10px}.logo,.sp{display:none}.grid,.focus{grid-template-columns:1fr}header,main{padding-left:16px;padding-right:16px}}
.gtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.gtabs .chip{padding:9px 18px;font-size:14px}
.add select{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:14px;padding:0 10px;font-size:14px;max-width:150px}
.tag{display:inline-block;background:var(--sf);color:var(--ac2);border-radius:10px;padding:2px 9px;font-size:12px;font-weight:600;margin-left:6px}
.ib{background:none;border:0;color:var(--mut);font-size:17px;cursor:pointer;padding:4px 6px}
.drop{border:2px dashed var(--ac);border-radius:24px;background:var(--card);padding:34px 20px;text-align:center;cursor:pointer;display:block;margin-bottom:18px}
.drop:hover,.drop.ov{background:var(--sf)}.drop .ic{font-size:44px}.drop input{display:none}
.pdf{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;border:0;text-align:left;color:var(--ink)}
.pdf:hover{outline:2px solid var(--ac)}.pdf .cv{height:100px;background:#E5484D;display:grid;place-items:center;font-size:30px}
.pdf .t{word-break:break-word}
.add{flex-wrap:wrap}.add input{min-width:130px}
.sm{color:var(--mut);font-size:13px;margin:8px 0}
details.card{display:block}details summary{cursor:pointer;font-weight:600}
details textarea{width:100%;margin-top:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:12px;padding:10px;font-size:14px}
.pdf.q .cv{background:var(--ac)}
</style></head>

 return Object.keys(r).map(Number).sort(function(a,b){return b-a}).map(function(y){return r[y].sort(function(a,b){return a.transform[4]-b.transform[4]}).map(function(i){return i.str}).join(' ').replace(/\s+/g,' ').trim()}).filter(Boolean)}
function mk(nm,ls){var hh=ls.some(function(l){return HD.test(l)}),it=[];
 ls.forEach(function(l){if(/^\d{1,3}$/.test(l)||/^page\s*\d+/i.test(l))return;
  var lv,tx=l,pv=it[it.length-1];
  if(/^[\u2022\u25CF\u25AA\u25A0\u00B7*\-\u2013\u2014]\s+/.test(l)){tx=l.replace(/^\S+\s+/,'');lv=1}
  else if(HD.test(l))lv=0;
  else if(/^\d+(\.\d+)+[\.\)]?\s/.test(l))lv=1;
  else if(/^\d+[\.\)]\s/.test(l))lv=hh?1:0;
  else if(/^[A-Z0-9 &\-:,\/]{4,}$/.test(l)&&/[A-Z]{3}/.test(l))lv=0;
  else{if(pv&&(/[,\-(]$/.test(pv.t)||/^[a-z]/.test(l))){pv.t+=' '+l;return}lv=hh?1:0}
  it.push({t:tx,lv:lv,d:0})});

  for(var p=1;p<=pdf.numPages;p++)(function(p){c=c.then(function(){return pdf.getPage(p)}).then(function(pg){return pg.getTextContent()}).then(function(tc){out=out.concat(ln(tc.items))})})(p);return c})
